[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langgraph-multi-agent-research-framework"
version = "0.1.0"
description = "Observable planner-supervisor multi-agent research framework built with LangGraph"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "langgraph>=1.2.0,<2.0.0",
  "langgraph-checkpoint-sqlite>=3.1.0,<4.0.0",
  "langchain-core>=1.4.7,<2.0.0",
  "langchain-openai>=1.3.0,<2.0.0",
  "pydantic-settings>=2.7.0,<3.0.0",
  "httpx>=0.27.0,<1.0.0",
  "ddgs>=9.0.0,<10.0.0",
  "rich>=13.9.0,<15.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.9.0"]

[project.scripts]
research-agents = "multi_agent_framework.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/multi_agent_framework"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
