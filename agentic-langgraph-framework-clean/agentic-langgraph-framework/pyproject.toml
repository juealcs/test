[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-langgraph-framework"
version = "0.1.0"
description = "Practical LangGraph agent framework with fast routing, tools, and durable memory"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=1.2.0,<2",
  "langgraph-checkpoint-sqlite>=3.0.0,<4",
  "langchain-core>=1.2.0,<2",
  "langchain-openai>=1.1.0,<2",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
agentic-ai = "agentic_framework.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_framework"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

