[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adaptive-langgraph-agent"
version = "0.1.0"
description = "Adaptive LangGraph agent with fast/deliberate routing and two-layer memory"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.6,<2",
  "langgraph-checkpoint-sqlite>=2,<4",
  "langchain>=0.3,<2",
  "langchain-openai>=0.3,<2",
  "pydantic>=2,<3",
  "python-dotenv>=1,<2",
  "httpx>=0.27,<1",
  "ddgs>=9,<10",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
adaptive-agent = "adaptive_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptive_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
